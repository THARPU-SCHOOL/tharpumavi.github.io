name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p twa
          echo "$KEYSTORE_BASE64" | base64 --decode > twa/my-release-key.jks

      - name: Configure Bubblewrap SDK paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Create twa-manifest.json
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > twa/twa-manifest.json << EOF
          {
            "packageId": "com.tharpumavi.app",
            "host": "tharpu-school.github.io",
            "name": "Tharpu Mavi",
            "launcherName": "Tharpu Mavi",
            "display": "standalone",
            "themeColor": "#FFFFFF",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#FFFFFF",
            "enableNotifications": false,
            "startUrl": "/tharpumavi.github.io/",
            "iconUrl": "https://tharpu-school.github.io/tharpumavi.github.io/icons/icon-512x512.png",
            "maskableIconUrl": "https://tharpu-school.github.io/tharpumavi.github.io/icons/icon-512x512.png",
            "monochromeIconUrl": "https://tharpu-school.github.io/tharpumavi.github.io/icons/icon-512x512.png",
            "shortcuts": [],
            "webManifestUrl": "https://tharpu-school.github.io/tharpumavi.github.io/manifest.json",
            "signingKey": {
              "path": "./my-release-key.jks",
              "alias": "$KEY_ALIAS"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0.0",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://tharpu-school.github.io/tharpumavi.github.io/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": [],
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isTrustedWebActivity": true,
            "fallbackType": "customtabs",
            "features": {},
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

      - name: Generate Android project
        run: |
          cd twa
          # init generates the Android project from twa-manifest.json non-interactively
          # by reading the manifest file directly — no prompts needed
          bubblewrap init \
            --manifest "https://tharpu-school.github.io/tharpumavi.github.io/manifest.json" \
            --directory "$(pwd)" < /dev/null || true
          # Overwrite the generated twa-manifest with ours (init may overwrite it)
          # Then regenerate project files from our manifest
          bubblewrap update --skipPwaValidation < /dev/null

      - name: Build and Sign APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="./my-release-key.jks" \
            --signingKeyAlias="${{ secrets.KEY_ALIAS }}"

      - name: Find APK
        run: find twa -name "*.apk" 2>/dev/null

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: twa/app-release-signed.apk
