name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/keystore.jks

      - name: Create WebView APK project
        run: |
          mkdir -p twa-app/app/src/main/java/com/tharpumavi/app
          mkdir -p twa-app/app/src/main/res/values
          mkdir -p twa-app/app/src/main/res/layout
          mkdir -p twa-app/app/src/main/res/drawable
          mkdir -p twa-app/app/src/main/res/mipmap-mdpi
          mkdir -p twa-app/app/src/main/res/mipmap-hdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xhdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p twa-app/gradle/wrapper

          # ── School logo icons ─────────────────────────────────────
          curl -sL "https://raw.githubusercontent.com/THARPU-SCHOOL/tharpumavi.github.io/main/THARPU%20SECONDARY%20SCHOOL.jpeg" \
            -o /tmp/logo.jpg
          convert /tmp/logo.jpg -resize 48x48   twa-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/logo.jpg -resize 72x72   twa-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/logo.jpg -resize 96x96   twa-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/logo.jpg -resize 144x144 twa-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/logo.jpg -resize 192x192 twa-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Splash logo (bigger)
          convert /tmp/logo.jpg -resize 300x300 twa-app/app/src/main/res/drawable/splash_logo.png

          # ── Gradle wrapper ────────────────────────────────────────
          curl -sL "https://github.com/gradle/gradle/raw/v7.6.1/gradle/wrapper/gradle-wrapper.jar" \
            -o twa-app/gradle/wrapper/gradle-wrapper.jar
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v7.6.1/gradlew" \
            -o twa-app/gradlew
          chmod +x twa-app/gradlew

          cat > twa-app/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > twa-app/settings.gradle << 'EOF'
          rootProject.name = "TharpuMavi"
          include ':app'
          EOF

          cat > twa-app/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > twa-app/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > twa-app/app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tharpumavi.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tharpumavi.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("$GITHUB_WORKSPACE/keystore.jks")
                      storePassword System.getenv("KSPASS")
                      keyAlias System.getenv("KSALIAS")
                      keyPassword System.getenv("KEYPASS")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # ── AndroidManifest.xml ───────────────────────────────────
          cat > twa-app/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:allowBackup="true"
                  android:label="Tharpu Mavi"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".SplashActivity"
                      android:exported="true"
                      android:theme="@style/SplashTheme"
                      android:noHistory="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".MainActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|keyboardHidden"/>
              </application>
          </manifest>
          EOF

          # ── SplashActivity.java ───────────────────────────────────
          cat > twa-app/app/src/main/java/com/tharpumavi/app/SplashActivity.java << 'EOF'
          package com.tharpumavi.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;

          public class SplashActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_splash);
                  new Handler().postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, MainActivity.class));
                      finish();
                  }, 2500);
              }
          }
          EOF

          # ── MainActivity.java ─────────────────────────────────────
          cat > twa-app/app/src/main/java/com/tharpumavi/app/MainActivity.java << 'EOF'
          package com.tharpumavi.app;

          import android.app.Activity;
          import android.content.Context;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends Activity {
              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              private ProgressBar progressBar;
              private LinearLayout offlineLayout;
              private static final String URL = "https://tharpu-school.github.io/tharpumavi.github.io/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webview);
                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  progressBar = findViewById(R.id.progressBar);
                  offlineLayout = findViewById(R.id.offlineLayout);
                  Button retryBtn = findViewById(R.id.retryBtn);

                  // Fullscreen
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  // SwipeRefresh colors
                  swipeRefresh.setColorSchemeColors(
                      0xFF1565C0, 0xFF0D47A1, 0xFF42A5F5
                  );

                  // WebView settings
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setUserAgentString(
                      "Mozilla/5.0 (Linux; Android 13; Pixel 7) " +
                      "AppleWebKit/537.36 (KHTML, like Gecko) " +
                      "Chrome/120.0.0.0 Mobile Safari/537.36"
                  );

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                          offlineLayout.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                          swipeRefresh.setRefreshing(false);
                      }
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              progressBar.setVisibility(View.GONE);
                              webView.setVisibility(View.GONE);
                              offlineLayout.setVisibility(View.VISIBLE);
                              swipeRefresh.setRefreshing(false);
                          }
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://tharpu-school.github.io")) {
                              return false;
                          }
                          return true;
                      }
                  });

                  swipeRefresh.setOnRefreshListener(() -> {
                      if (isOnline()) {
                          webView.reload();
                      } else {
                          swipeRefresh.setRefreshing(false);
                          offlineLayout.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.GONE);
                      }
                  });

                  retryBtn.setOnClickListener(v -> {
                      if (isOnline()) {
                          offlineLayout.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          webView.loadUrl(URL);
                      }
                  });

                  if (isOnline()) {
                      webView.loadUrl(URL);
                  } else {
                      offlineLayout.setVisibility(View.VISIBLE);
                      webView.setVisibility(View.GONE);
                  }
              }

              private boolean isOnline() {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  NetworkInfo info = cm.getActiveNetworkInfo();
                  return info != null && info.isConnected();
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # ── activity_splash.xml ───────────────────────────────────
          cat > twa-app/app/src/main/res/layout/activity_splash.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#0D47A1">
              <ImageView
                  android:layout_width="180dp"
                  android:layout_height="180dp"
                  android:src="@drawable/splash_logo"
                  android:scaleType="fitCenter"
                  android:layout_marginBottom="24dp"/>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Tharpu Mavi"
                  android:textColor="#FFFFFF"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:fontFamily="sans-serif-medium"
                  android:layout_marginBottom="8dp"/>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Tharpu Secondary School"
                  android:textColor="#90CAF9"
                  android:textSize="14sp"/>
          </LinearLayout>
          EOF

          # ── activity_main.xml ─────────────────────────────────────
          cat > twa-app/app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FFFFFF">

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="@android:style/Widget.Material.ProgressBar.Horizontal"
                  android:layout_width="match_parent"
                  android:layout_height="4dp"
                  android:layout_alignParentTop="true"
                  android:indeterminate="true"
                  android:indeterminateTint="#1565C0"
                  android:visibility="gone"/>

              <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                  android:id="@+id/swipeRefresh"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/progressBar">

                  <WebView
                      android:id="@+id/webview"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"/>
              </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>

              <LinearLayout
                  android:id="@+id/offlineLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:gravity="center"
                  android:background="#FFFFFF"
                  android:visibility="gone">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="📡"
                      android:textSize="64sp"
                      android:layout_marginBottom="16dp"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="No Internet Connection"
                      android:textSize="20sp"
                      android:textStyle="bold"
                      android:textColor="#1565C0"
                      android:layout_marginBottom="8dp"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Please check your connection and try again"
                      android:textSize="14sp"
                      android:textColor="#757575"
                      android:gravity="center"
                      android:layout_marginBottom="32dp"
                      android:paddingHorizontal="32dp"/>
                  <Button
                      android:id="@+id/retryBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Try Again"
                      android:backgroundTint="#1565C0"
                      android:textColor="#FFFFFF"
                      android:paddingHorizontal="32dp"
                      android:paddingVertical="12dp"/>
              </LinearLayout>
          </RelativeLayout>
          EOF

          # ── styles.xml ────────────────────────────────────────────
          cat > twa-app/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#1565C0</item>
                  <item name="colorPrimaryDark">#0D47A1</item>
                  <item name="colorAccent">#42A5F5</item>
              </style>
              <style name="SplashTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0D47A1</item>
                  <item name="android:statusBarColor">#0D47A1</item>
                  <item name="android:navigationBarColor">#0D47A1</item>
              </style>
          </resources>
          EOF

          cat > twa-app/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Tharpu Mavi</string>
          </resources>
          EOF

      - name: Build Release APK
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-app
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: find twa-app -name "*.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: twa-app/app/build/outputs/apk/release/*.apk
