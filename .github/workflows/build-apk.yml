name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Create TWA Android project from scratch
        run: |
          mkdir -p twa-app/app/src/main/res/values
          mkdir -p twa-app/app/src/main/res/xml
          mkdir -p twa-app/gradle/wrapper

          # ── settings.gradle ──────────────────────────────────────
          cat > twa-app/settings.gradle << 'EOF'
          rootProject.name = "TharpuMavi"
          include ':app'
          EOF

          # ── project build.gradle ─────────────────────────────────
          cat > twa-app/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ── gradle.properties ────────────────────────────────────
          cat > twa-app/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # ── gradle wrapper ───────────────────────────────────────
          cat > twa-app/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Download gradlew
          cd twa-app
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v7.6.1/gradlew -o gradlew
          chmod +x gradlew
          cd ..

          # ── app/build.gradle ─────────────────────────────────────
          cat > twa-app/app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tharpumavi.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tharpumavi.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  manifestPlaceholders = [
                      hostName: "tharpu-school.github.io",
                      defaultUrl: "https://tharpu-school.github.io/tharpumavi.github.io/",
                      launcherName: "Tharpu Mavi",
                      assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "web", "site": "https://tharpu-school.github.io" } }]'
                  ]
              }
              signingConfigs {
                  release {
                      storeFile file("../../keystore.jks")
                      storePassword System.getenv("KSPASS")
                      keyAlias System.getenv("KSALIAS")
                      keyPassword System.getenv("KEYPASS")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.4.0'
          }
          EOF

          # ── AndroidManifest.xml ──────────────────────────────────
          cat > twa-app/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="${launcherName}"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <meta-data
                      android:name="asset_statements"
                      android:value="${assetStatements}" />
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="${defaultUrl}" />
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:scheme="https" android:host="${hostName}"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ── styles.xml ───────────────────────────────────────────
          cat > twa-app/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#FFFFFF</item>
                  <item name="colorPrimaryDark">#FFFFFF</item>
                  <item name="colorAccent">#000000</item>
              </style>
          </resources>
          EOF

          # ── strings.xml ──────────────────────────────────────────
          cat > twa-app/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Tharpu Mavi</string>
          </resources>
          EOF

      - name: Build Release APK
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-app
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: find twa-app -name "*.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: twa-app/app/build/outputs/apk/release/*.apk
