name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Clone pwa2apk
        run: git clone https://github.com/Tonihj77-T/pwa2apk.git

      - name: Install pwa2apk
        run: cd pwa2apk && npm install

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.jks

      - name: Test password
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "Password length: ${#KSPASS}"
          echo "Alias: $KSALIAS"
          keytool -list -keystore my-release-key.jks -storepass "$KSPASS" -alias "$KSALIAS"

      - name: Build APK
        run: |
          cd pwa2apk && node bin/pwa2apk.js \
            --url https://tharpu-school.github.io/tharpumavi.github.io/ \
            --name "Tharpu Mavi" \
            --package com.tharpumavi.app \
            --output ../dist

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null

      - name: Sign APK
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)
          APK_FILE=$(find . -name "*.apk" | head -1)
          echo "Build tools: $BUILD_TOOLS"
          echo "APK: $APK_FILE"
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks my-release-key.jks \
            --ks-pass pass:"$KSPASS" \
            --key-pass pass:"$KEYPASS" \
            --ks-key-alias "$KSALIAS" \
            --out dist/app-signed.apk \
            "$APK_FILE"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: dist/app-signed.apk
