name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Clone pwa2apk
        run: git clone https://github.com/Tonihj77-T/pwa2apk.git

      - name: Install pwa2apk
        run: cd pwa2apk && npm install

      - name: Build APK
        run: |
          mkdir -p dist
          cd pwa2apk && node bin/pwa2apk.js \
            --url https://tharpu-school.github.io/tharpumavi.github.io/ \
            --name "Tharpu Mavi" \
            --package com.tharpumavi.app \
            --output ../dist
          echo "Exit code: $?"

      - name: Show all files after build
        run: |
          echo "=== dist folder ==="
          find dist -type f 2>/dev/null || echo "dist empty"
          echo "=== android.project folder ==="
          find dist/android.project -type f 2>/dev/null || echo "no android.project"
          echo "=== ALL files in workspace ==="
          find . -type f -name "*.apk" 2>/dev/null || echo "no apk found"
          find . -type f -name "*.aab" 2>/dev/null || echo "no aab found"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: dist/android.project
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
