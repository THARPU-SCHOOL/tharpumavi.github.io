name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Clone pwa2apk
        run: git clone https://github.com/Tonihj77-T/pwa2apk.git

      - name: Install pwa2apk
        run: cd pwa2apk && npm install

      - name: Generate Android project
        run: |
          mkdir -p dist
          cd pwa2apk && node bin/pwa2apk.js \
            --url https://tharpu-school.github.io/tharpumavi.github.io/ \
            --name "Tharpu Mavi" \
            --package com.tharpumavi.app \
            --output ../dist

      - name: Debug - Show generated Gradle wrapper
        run: |
          echo "=== gradle-wrapper.properties ==="
          cat dist/android-project/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== project build.gradle ==="
          cat dist/android-project/build.gradle || cat dist/android-project/build.gradle.kts || echo "not found"
          echo ""
          echo "=== app build.gradle ==="
          cat dist/android-project/app/build.gradle || cat dist/android-project/app/build.gradle.kts || echo "not found"

      - name: Force Gradle 8.11.1
        run: |
          WRAPPER="dist/android-project/gradle/wrapper/gradle-wrapper.properties"
          # Overwrite entire file to be safe
          cat > "$WRAPPER" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "=== Verified wrapper ==="
          cat "$WRAPPER"

      - name: Downgrade AGP to be compatible with Gradle 8
        run: |
          BUILD="dist/android-project/build.gradle"
          BUILD_KTS="dist/android-project/build.gradle.kts"
          if [ -f "$BUILD" ]; then
            sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.2.2/g" "$BUILD"
            echo "=== project build.gradle after patch ==="
            cat "$BUILD"
          fi
          if [ -f "$BUILD_KTS" ]; then
            sed -i "s/com.android.application.*version \"[0-9.]*\"/com.android.application\" version \"8.2.2\"/g" "$BUILD_KTS"
            echo "=== project build.gradle.kts after patch ==="
            cat "$BUILD_KTS"
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > dist/android-project/my-release-key.jks

      - name: Build and Sign APK with Gradle
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd dist/android-project
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release-key.jks \
            -Pandroid.injected.signing.store.password="$KSPASS" \
            -Pandroid.injected.signing.key.alias="$KSALIAS" \
            -Pandroid.injected.signing.key.password="$KEYPASS"

      - name: Find signed APK
        run: find dist -name "*.apk" 2>/dev/null

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: dist/android-project/app/build/outputs/apk/release/*.apk
