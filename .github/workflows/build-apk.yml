name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/keystore.jks

      - name: Create WebView APK project
        run: |
          mkdir -p twa-app/app/src/main/java/com/tharpumavi/app
          mkdir -p twa-app/app/src/main/res/values
          mkdir -p twa-app/app/src/main/res/layout
          mkdir -p twa-app/app/src/main/res/mipmap-hdpi
          mkdir -p twa-app/gradle/wrapper

          # ── gradle wrapper jar ────────────────────────────────────
          curl -sL "https://github.com/gradle/gradle/raw/v7.6.1/gradle/wrapper/gradle-wrapper.jar" \
            -o twa-app/gradle/wrapper/gradle-wrapper.jar

          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v7.6.1/gradlew" \
            -o twa-app/gradlew
          chmod +x twa-app/gradlew

          # ── gradle wrapper properties ─────────────────────────────
          cat > twa-app/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # ── settings.gradle ───────────────────────────────────────
          cat > twa-app/settings.gradle << 'EOF'
          rootProject.name = "TharpuMavi"
          include ':app'
          EOF

          # ── project-level build.gradle ────────────────────────────
          cat > twa-app/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ── gradle.properties ─────────────────────────────────────
          cat > twa-app/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          # ── app/build.gradle — NO external dependencies ───────────
          cat > twa-app/app/build.gradle << EOF
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tharpumavi.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tharpumavi.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("$GITHUB_WORKSPACE/keystore.jks")
                      storePassword System.getenv("KSPASS")
                      keyAlias System.getenv("KSALIAS")
                      keyPassword System.getenv("KEYPASS")
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # ── AndroidManifest.xml ───────────────────────────────────
          cat > twa-app/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:label="Tharpu Mavi"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ── MainActivity.java ─────────────────────────────────────
          cat > twa-app/app/src/main/java/com/tharpumavi/app/MainActivity.java << 'EOF'
          package com.tharpumavi.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String URL = "https://tharpu-school.github.io/tharpumavi.github.io/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://tharpu-school.github.io")) {
                              return false;
                          }
                          return true;
                      }
                  });

                  // Hide system UI for fullscreen
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  webView.loadUrl(URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # ── layout (not needed since we set view programmatically) ─
          # ── styles.xml ────────────────────────────────────────────
          cat > twa-app/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#FFFFFF</item>
                  <item name="colorPrimaryDark">#FFFFFF</item>
                  <item name="colorAccent">#000000</item>
              </style>
          </resources>
          EOF

          # ── strings.xml ───────────────────────────────────────────
          cat > twa-app/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Tharpu Mavi</string>
          </resources>
          EOF

          echo "=== Project structure ==="
          find twa-app -type f | sort

      - name: Build Release APK
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-app
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: find twa-app -name "*.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: twa-app/app/build/outputs/apk/release/*.apk
