name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Clone pwa2apk
        run: git clone https://github.com/Tonihj77-T/pwa2apk.git

      - name: Install pwa2apk
        run: cd pwa2apk && npm install

      - name: Generate Android project
        run: |
          mkdir -p dist
          cd pwa2apk && node bin/pwa2apk.js \
            --url https://tharpu-school.github.io/tharpumavi.github.io/ \
            --name "Tharpu Mavi" \
            --package com.tharpumavi.app \
            --output ../dist

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > dist/android-project/my-release-key.jks

      - name: Patch Gradle files
        run: |
          PROJECT="dist/android-project"

          # Fix 1: Downgrade Gradle to 8.3 (8.5 has config mutation bug with androidbrowserhelper)
          cat > "$PROJECT/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Fix 2: The app/build.gradle expects RELEASE_STORE_FILE property, not android.injected.*
          # Add signing properties to gradle.properties so the signingConfigs block picks them up
          cat >> "$PROJECT/gradle.properties" << EOF

          RELEASE_STORE_FILE=$(pwd)/$PROJECT/my-release-key.jks
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

          # Fix 3: Suppress known compat warnings
          echo "android.suppressUnsupportedCompileSdk=34" >> "$PROJECT/gradle.properties"
          echo "android.useAndroidX=true" >> "$PROJECT/gradle.properties"

      - name: Build and Sign APK with Gradle
        run: |
          cd dist/android-project
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Find signed APK
        run: find dist -name "*.apk" 2>/dev/null

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: dist/android-project/app/build/outputs/apk/release/*.apk
