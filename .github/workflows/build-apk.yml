name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Clone pwa2apk
        run: git clone https://github.com/Tonihj77-T/pwa2apk.git

      - name: Install pwa2apk
        run: cd pwa2apk && npm install

      - name: Generate Android project
        run: |
          mkdir -p dist
          cd pwa2apk && node bin/pwa2apk.js \
            --url https://tharpu-school.github.io/tharpumavi.github.io/ \
            --name "Tharpu Mavi" \
            --package com.tharpumavi.app \
            --output ../dist

      - name: Patch Android project
        run: |
          PROJECT="dist/android-project"

          # 1. Pin Gradle to 7.6.1 — last version where androidbrowserhelper works cleanly
          cat > "$PROJECT/gradle/wrapper/gradle-wrapper.properties" << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 2. Pin AGP to 7.4.2 — compatible with Gradle 7.6.1
          cat > "$PROJECT/build.gradle" << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 3. Fix gradle.properties
          cat > "$PROJECT/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. Verify
          echo "=== wrapper ==="
          cat "$PROJECT/gradle/wrapper/gradle-wrapper.properties"
          echo "=== build.gradle ==="
          cat "$PROJECT/build.gradle"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > dist/android-project/my-release-key.jks

      - name: Build and Sign APK
        env:
          KSPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KSALIAS: ${{ secrets.KEY_ALIAS }}
          KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd dist/android-project
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=$(pwd)/my-release-key.jks \
            -PRELEASE_STORE_PASSWORD="$KSPASS" \
            -PRELEASE_KEY_ALIAS="$KSALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEYPASS" \
            --stacktrace

      - name: Find signed APK
        run: find dist -name "*.apk" 2>/dev/null

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: dist/android-project/app/build/outputs/apk/release/*.apk
